version: "2"
run:
  tests: true
linters:
  disable:
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Writer).Write
        - (*testing.T).Errorf
        - (*testing.T).Fatalf
    govet:
      # `inline` (new govet pass, flags deprecated stdlib aliases like
      # ioutil.ReadFile/reflect.Ptr as "should be inlined" to their modern
      # replacement) surfaces ~12 pre-existing, unrelated call sites -
      # same "fix separately" treatment as the ioutil staticcheck exclusion
      # below, not something to drive-by fix in an unrelated change.
      disable:
        - inline
    staticcheck:
      # v1's separate `staticcheck` and `gosimple` linters were merged into
      # one `staticcheck` linter in golangci-lint v2, backed by the full
      # honnef.co/go/tools multichecker (SA + ST + QF categories) rather than
      # just SA. `checks: [all, ...]` now pulls in ST (style, e.g.
      # "error strings should not be capitalized") and QF (quickfix
      # suggestions) checks that were never enabled before and flag hundreds
      # of pre-existing, intentional patterns in this codebase - scope back
      # down to SA (bug-pattern) + S1xxx (the old gosimple checks) explicitly
      # to preserve v1's actual behavior instead of "all" pulling in whole
      # new categories on every future golangci-lint update.
      checks:
        - SA*
        - S1*
        - -S1011
        - -S1020
        - -S1021
        - -S1034
        - -S1039
        - -SA4006
        - -SA4010
        - -SA4017
        - -SA4023
        - -SA5011
        - -SA9003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - ineffassign
        path: _test\.go
      - linters:
          - staticcheck
        text: SA1019.*ioutil
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
